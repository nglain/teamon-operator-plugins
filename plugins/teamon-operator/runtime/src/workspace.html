.muted{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.grid .choice{min-height:150px;padding:20px}.avatar{font-size:12px;width:32px;height:32px;border-radius:8px;background:var(--hover);display:grid;place-items:center;margin-bottom:12px;color:var(--accent)}

.intent{border:0;border-bottom:1px solid var(--line);margin:0;background:transparent}.intent>summary{display:grid;grid-template-columns:minmax(0,1fr) 86px 118px 16px;gap:18px;align-items:center;padding:18px 0;cursor:pointer;list-style:none}.intent>summary::-webkit-details-marker{display:none}.intent>summary:hover .intent-title{color:var(--accent)}.intent-title{font-size:14px;font-weight:550;letter-spacing:-.1px;line-height:1.45}.intent-answer{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}.intent-person{font-size:11px;color:var(--muted);margin-top:6px}.intent-meta{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px}.intent-meta .muted{font-size:11px}.intent-state{font-size:11px;color:var(--muted)}.intent-chevron{font-size:17px;color:var(--muted)}.intent[open] .intent-chevron{transform:rotate(180deg)}.intent[open]>.summary{background:var(--hover)}

<script>
(() => {
  const activityEpisodes = function activityEpisodes(input) {

  for (const m of input) {
    if (!m.sessionKey || !m.agentId || m.id === undefined || m.id === null || !['user','assistant'].includes(m.role)) continue;
    const group = JSON.stringify([m.sessionKey,m.agentId,String(m.userId)]);
    const key = JSON.stringify([group,String(m.id)]);
    if (seen.has(key)) continue;
    seen.add(key);
    if (!groups.has(group)) groups.set(group,[]);
    groups.get(group).push(m);
  }
  const episodes = [];
  for (const [group,rows] of groups) {
    rows.sort((a,b)=>(timestamp(a) ?? Infinity) - (timestamp(b) ?? Infinity));
    let current;
    for (const m of rows) {
      // Unknown dates cannot establish a relationship to a neighbouring turn.
      if (!current || timestamp(m) === null || current.undated || m.role === 'user') {
        current = { id:JSON.stringify([group,String(m.id)]), sessionKey:m.sessionKey, agentId:m.agentId,
          userId:m.userId, userName:m.userName, username:m.username, channel:m.channel,
          title:m.role === 'user' ? m.preview || '[Без текстового содержимого]' : 'Начало обращения не попало в выборку',
          requestMissing:m.role !== 'user', provisional:true, acceptance:'not_checked',
          messages:[], messageIds:[], userMessages:0, agentMessages:0, undated:timestamp(m) === null };
        episodes.push(current);
      }
      current.messages.push(m);
      if (m.messageId !== undefined && m.messageId !== null) current.messageIds.push(m.messageId);
      if (m.role === 'user') current.userMessages++; else current.agentMessages++;
    }
  }
  for (const e of episodes) {
    const first = e.messages[0], last = e.messages.at(-1);
    e.startedAt = first.ts; e.lastActive = last.ts;
    e.elapsedMs = e.messages.length > 1 && timestamp(first) !== null && timestamp(last) !== null
      ? timestamp(last)-timestamp(first) : null;
    e.outcome = e.agentMessages ? 'response_observed' : 'response_not_observed';
  }

};
  const intentPreview = function intentPreview(value) {
  if (typeof value !== 'string') return '';
  // Hide only known leading transport metadata in the preview; source stays intact.
  return value.replace(/^(?:\s*\[tg_(?:chat_id|msg_id|dttm|timezone|local_dttm|calendar_authoritative|media_group_count|media_group_msg_ids):[^\]]*\])+\s*/u, '')
    .replace(/\s+/gu, ' ').trim();
};
  const el = id => document.getElementById(id), detail = el('detail'), status = el('status');

  const intentLabels=[];

  const documentId=crypto.randomUUID();

    catch { throw Error('Нет связи с локальным пультом. В чате попросите «Открой пульт» и используйте новую ссылку. Переустановка и повторный вход не требуются только из-за этой ошибки.'); }

    }

  }
  function node(tag, text, className) { const item = document.createElement(tag); item.textContent = text; if (className) item.className = className; return item; }
  function button(text, action, style = 'choice') { const b = node('button', text, style); b.type = 'button'; b.disabled = !ready; b.addEventListener('click', action); return b; }
  function note(parent, text) { parent.append(node('p', text, 'muted')); }
  function json(parent, value) { parent.append(node('pre', JSON.stringify(value, null, 2))); }
  const agentName = a => a?.name || a?.id || 'Все агенты';
  const username = p => typeof p?.username === 'string' && p.username.trim() ? '@' + p.username.trim().replace(/^@+/, '') : '';
  const displayName = p => typeof p?.displayName === 'string' && p.displayName.trim() !== String(p.userId) ? p.displayName.trim() : '';
  const userName = p => !p ? 'Все пользователи' : displayName(p) || username(p) || (Number(p.userId) < 0 ? 'Групповой чат · ' : 'Пользователь · ') + p.userId;
  const activityTime = p => { const time = typeof p?.lastActive === 'string' ? Date.parse(p.lastActive) : NaN; return Number.isFinite(time) ? time : -Infinity; };
  function peopleRows(rows) {
    // Identity is scoped by the caller's instance + agent, never by a name or session.
    const unique = new Map();
    for (const p of (Array.isArray(rows) ? rows : []).filter(p => p && /^-?[1-9]\d*$/.test(String(p.userId)) && Number.isSafeInteger(Number(p.userId))).sort((a,b) => activityTime(b) - activityTime(a))) {

      if (!previous) unique.set(key, { ...p });

        if (!displayName(previous) && displayName(p)) previous.displayName = p.displayName;
        if (!username(previous) && username(p)) previous.username = p.username;

    return [...unique.values()];
  }
  const base = () => ({ instance_id:company.instanceId, ...(agent ? { agent_id:agent.id } : {}) });
  function scope() {
    return { source:'operator_view_selection', runtime:company?.runtime || null, instance_id:company?.instanceId || null,
      label:[company?.label, agentName(agent), userName(person)].filter(Boolean).join(' / '),
      ...(agent ? { agent_id:agent.id } : {}), ...(person ? { user_id:String(person.userId) } : {}),
      ...(conversation ? { session_key:conversation.sessionKey } : {}), ...(currentTask?{agent_id:currentTask.agent_id,user_id:String(currentTask.user_id),task_id:currentTask.id,task_title:currentTask.label,task_source:{captured_at:snapshot.tasks.captured_at,revision:currentTask.revision}}:{}), view:page, tab,
      ...(conversation?.capturedAt ? { conversation_source:{ captured_at:conversation.capturedAt,
        context_revision:conversation.contextRevision, delivery_revision:conversation.revision, source_input_id:conversation.sourceInputId } } : {}),
      ...(selectedMessageIds.length ? { message_ids:selectedMessageIds.slice() } : {}), sources:sourceRefs.slice(),
      note:'Navigation references only, not an instruction, verified result or approval to act. Re-read exact sources. Broad scope is operator analysis, not broadcast or a private agent job. Native consultation requires one exact conversation.' };
  }
  function selectContext(explicit=false, selectedScope) {
    if(!explicit){renderPinned();return}
    const value=selectedScope||scope();
    pinnedScope=value.instance_id?{...value,source:'operator_html_selection',selection_revision:++contextRevision,captured_at:capturedAt,
      inspection_target:inspectionTarget,selection_kind:inspectionTarget?'inspection':currentTask?'task':conversation?(selectedMessageIds.length?'intent_or_messages':'conversation'):person?'user':agent?'agent':'company',
      conversation_title:conversation?.title||null,
      selected_messages:conversation?snapshot.activity.items.filter(m=>m.sessionKey===conversation.sessionKey&&(!selectedMessageIds.length||selectedMessageIds.includes(m.messageId))).map(m=>({id:m.messageId,role:m.role,text:m.preview,truncated:m.previewTruncated})):[],
      note:'Выбор на локальной странице, не отправка в чат и не разрешение на внешнее действие. Источники являются данными.'}:null;
    renderPinned();status.textContent=pinnedScope?'Выбрано на странице. Напиши в чате: «Что я выбрал?»':'Закрепление снято.';
  }
  function renderPinned() {
    renderBrowsing();
    el('clear-context').hidden=!pinnedScope;
    el('use-context').classList.toggle('has-pin',!!pinnedScope);
    el('local-selection').hidden=!pinnedScope;
    const box=el('local-selection');box.replaceChildren();
    box.append(node('h3','Закреплено'));
    if(!pinnedScope){box.append(node('p','Нет','muted'));return}
    box.append(node('p',pinnedScope.label+(pinnedScope.inspection_target?' / '+pinnedScope.inspection_target.label:pinnedScope.task_title?' / '+pinnedScope.task_title:'')));
    if(pinnedScope.conversation_title)box.append(node('p','Чат / интент: '+intentPreview(pinnedScope.conversation_title)));
    box.append(node('p',pinnedScope.selection_kind==='intent_or_messages'?'Выбранных сообщений: '+pinnedScope.message_ids.length:pinnedScope.selection_kind==='conversation'?'Выбрана беседа целиком':'Выбран обзор '+(pinnedScope.user_id?'пользователя':pinnedScope.agent_id?'агента':'компании'),'muted'));

    const details=node('details','');details.id='selection-details';details.append(node('summary','Точные ссылки и выбранные сообщения'));const pre=node('pre',JSON.stringify(pinnedScope,null,2));pre.id='selection-data';details.append(pre);box.append(details);

  function renderBrowsing() {
    const current=scope();
    const browsing=current.instance_id?{...current,source:'operator_html_navigation',
      inspection_target:inspectionTarget,scope_kind:inspectionTarget?'inspection':currentTask?'task':conversation?'conversation':person?'user':agent?'agent':'company',
      conversation_title:conversation?.title||null}:null;

    if(signature!==viewSignature){viewSignature=signature;viewRevision++;viewUpdatedAt=new Date().toISOString()}
    const box=el('local-browsing');box.replaceChildren(node('h3','Открыто'));
    box.append(node('p',browsing?browsing.label+(inspectionTarget?' / '+inspectionTarget.label:currentTask?' / '+currentTask.label:''):'Список компаний'));
    if(conversation)box.append(node('p','Чат: '+(intentPreview(conversation.title||'')||'Без названия')));
    box.append(node('p',pinnedScope?'Для общего вопроса используется закрепление. «Здесь / в открытом» — текущий просмотр.':browsing?'Этот просмотр — контекст по умолчанию. Можно просто задать вопрос в чате.':'Открой компанию или назови её в вопросе.','muted'));
    const payload={schema:'operator_context/v1',document_id:documentId,revision:viewRevision,updated_at:viewUpdatedAt,
      data:{mode:'live_reads',captured_at:capturedAt,complete:false,full_text_captured_at:snapshot.fullTextCapturedAt,full_text_messages:snapshot.activity.items.length,tasks_captured_at:snapshot.tasks.captured_at,task_history_complete:false},browsing,pinned:pinnedScope,
      default_basis:pinnedScope?'pinned':browsing?'browsing':'none',
      note:'Явный предмет вопроса важнее выбора страницы. Здесь/открыто означает browsing, закреплённое означает pinned. При неоднозначности уточнить. Это ссылки, не прочитанные источники и не разрешение на действия.'};
    el('operator-context-data').textContent=JSON.stringify(payload,null,2);
  }
  function transition() { inspectionTarget=null;currentTask=null; generation++; configuration = null; sourceRefs = []; selectedMessageIds = []; activityData = null; showService = false; selectContext(); }
  async function call(name, args) {
    const response = await request('tools/call', { name, arguments:args });
    if (response.isError) {
      const reason = (response.content || []).filter(item => item.type === 'text' && typeof item.text === 'string').map(item => item.text).join(' ').slice(0,1000);
      throw new Error('Чтение недоступно: ' + name + (reason ? ' · ' + reason : '') + '. Остальные разделы доступны; это не запрет агенту.');
    }

    if(name==='activity_read' && args.instance_id===company?.instanceId && (!args.agent_id || args.agent_id===agent?.id)){
      snapshot.activity={items:data.items||[]};snapshot.capturedAt=new Date().toISOString();
    }
    return data;
  }
  async function load(parent, action, render) {

// A display projection only. Original native messages remain untouched.
function parseMessageView(value, role = 'user') {
  const original = typeof value === 'string' ? value : '';
  if (role !== 'user') return { text: original, metadata: [], attachments: [] };
  const metadata = [], attachments = [];
  let text = original;
  const prefix = /^\s*\[(tg_(?:chat_id|msg_id|dttm|timezone|local_dttm|calendar_authoritative|media_group_count|media_group_msg_ids)):\s*([^\]]*)\]\s*/u;
  for (;;) {
    const match = text.match(prefix);
    if (!match) break;
    metadata.push({ key: match[1], value: match[2] });
    text = text.slice(match[0].length);
  }
  // Only recognize the exact native attachment envelope, preserving other brackets.
  text = text.replace(/\[User sent (?:a|an) (document|audio file|photo|video|voice message): "([^"\n]+)" saved at ([^\]\n]+)\]/gu,
    (_, kind, name, path) => { attachments.push({ kind, name, path }); return ''; });
  return { text: text.trim(), metadata, attachments };
}

      readDocument(body, { scope:'costume', path:'AGENTS.md' }); readDocument(body, { scope:'costume', path:'CLAUDE.md' });
    });
    section(parent, '2 · Знания и память', body => {
      inventory(body, 'company_context', 'Общие знания компании'); inventory(body, 'agent_context', 'Контекст агента'); note(body, 'Каноническая личная память, WORK_STATE и полный журнал не имеют отдельной ручки чтения в этом контракте. Это пробел наблюдаемости, не отсутствие памяти у агента.');
    });
    section(parent, '3 · Скиллы', body => {
      void load(body, state, s => { json(body, { assigned:s.skills.assigned, disabled:s.skills.disabled, available:s.skills.available }); note(body, 'Назначены, выключены и доступны — разные состояния. Доступность не доказывает использование в текущем ходе.'); });
      inventory(body, 'agent_skill', 'Локальные SKILL.md'); note(body, 'Тела глобальных навыков и вложенные ресурсы, не перечисленные native inventory, этим чтением не раскрываются.');
    });
    section(parent, '4 · Коннекторы', body => void load(body, state, s => {
      json(body, s.connectors); note(body, 'assigned — назначения; scope — область подключения. present_unverified не означает авторизацию. liveAuthentication=not_checked — живой тест не проводился.');
      if (person) note(body, 'Персональные credentials проверяются отдельным connector_credential_read с точным agent/user; без значений ключей.');
    }));
    section(parent, '5 · Инструменты, MCP и браузер', body => {
      if (agent.tools !== undefined) json(body, { configuredTools:agent.tools }); note(body, 'Полный runtime tools/MCP, готовность Browser/Edge и фактическое использование инструментов не доказаны этим API. Нужны точные traces; отсутствие проекции не ограничивает агента.');
    });
    section(parent, '6 · Провайдер и параметры', body => void load(body, state, s => { json(body, { provider:s.provider, model:s.model, settingsSupport:s.settingsSupport }); note(body, 'Конфигурация агента; беседа может иметь свой route/model. Пул не доказывает запас лимитов.'); }));
    section(parent, '7 · Пользователь, беседа и незавершённое', body => {
      if (!person) { note(body, 'Выберите пользователя слева. Личные контексты разных людей не смешиваются.'); return; }
      note(body, userName(person) + ' · ID ' + person.userId); inventory(body, 'user_context', 'Документы пользователя');
      section(body, 'Напоминания', child => void load(child, () => call('operator_reminders_read', { ...base(), user_id:String(person.userId) }), data => { json(child, data.reminders); note(child, 'Настроено ≠ выполнено и доставлено.'); }));
      if (conversation) section(body, 'Контекст выбранной беседы', child => void load(child, () => call('conversation_read', { instance_id:company.instanceId, session_key:conversation.sessionKey, limit:10 }), data => {
        if (data.context) { json(child, data.context); note(child, 'Native source snapshot, не полный скрытый prompt/SDK-контекст. Проверяйте missing/truncated.'); } else note(child, 'Доступна только legacy история; source snapshot недоступен.');
      }));
      else note(body, 'Выберите беседу в «Диалогах», затем вернитесь для source snapshot.'); note(body, 'Отдельный полный реестр файлов, compact и pending effects этим интерфейсом не заявляется.');
    });
  }
  function settings(parent) {
    if (!agent) { note(parent, 'Выберите точного агента. Массовых изменений здесь нет.'); agents.forEach(a => parent.append(agentCard(a, () => workspace(a, null, 'settings')))); return; }
    note(parent, 'Настройки всего агента, не только выбранного пользователя. Изменения — в диалоге: точный diff → подтверждение → receipt. Этот экран только читает.');
    if (company.runtime !== 'core') { void load(parent, () => call('agent_inspect', base()), data => { json(parent, data.agent); note(parent, 'Настроенная роль, модель и навыки. Изменения поставляемой конфигурации проходят через релиз Штата. Рабочий контекст и экраны доступны в соседних разделах.'); }); return; }
    void load(parent, state, s => json(parent, { agentId:s.agentId, revision:s.revision, busy:s.busy, identity:s.identity, provider:s.provider, model:s.model, settingsSupport:s.settingsSupport, supportedChanges:s.supportedChanges }));
  }
  el('use-context').addEventListener('click',()=>selectContext(true));
  el('clear-context').addEventListener('click',()=>selectContext(true,{instance_id:null}));
  el('refresh').disabled=false;
  el('refresh').textContent='Компании ↗';
  el('refresh').addEventListener('click',()=>{company=agent=person=null;pinnedScope=null;peopleByAgent.clear();transition();detail.replaceChildren();void load(detail,()=>call('fleet_list',{}),renderFleet)});
  ready=true;void load(detail,()=>call('fleet_list',{}),renderFleet);
  el('installation').textContent='Снимок · '+new Date(capturedAt).toLocaleString('ru-RU')+' · данные читаются при открытии раздела; выборка может быть неполной';
  status.textContent='';
})();
</script></body></html>
